<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ibiza Eclipse Tarot </title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFC107">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --theme: #FFC107; --bg: #0a0a0c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        #app { min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Navigation */
        .nav-bottom { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); padding: 0.8rem 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; padding-bottom: calc(0.8rem + env(safe-area-inset-bottom)); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #555; text-decoration: none; font-size: 0.55rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.3s; flex: 1; }
        .nav-item.active { color: var(--theme); }
        .nav-item svg { width: 20px; height: 20px; margin-bottom: 2px; }

        /* Screens */
        .screen { flex: 1; display: none; padding-bottom: 120px; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* General UI Elements */
        .header { text-align: center; padding: 4rem 2rem 2rem; }
        .header h1 { font-family: 'Cinzel', serif; color: var(--theme); font-size: 2rem; letter-spacing: 0.2em; margin: 0; }
        .subtitle { opacity: 0.4; text-transform: uppercase; letter-spacing: 0.4em; font-size: 0.6rem; margin-top: 0.5rem; }
        .logo { width: 60px; height: 60px; margin: 0 auto 1.5rem; display: block; object-fit: contain; }

        /* Oracle Styles */
        .oracle-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; padding: 2rem; }
        .card-box { perspective: 1000px; cursor: pointer; margin-bottom: 2rem; }
        .card-inner { width: 220px; height: 350px; position: relative; transition: transform 0.8s; transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-side { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .card-front { transform: rotateY(180deg); }
        .card-side img { width: 100%; height: 100%; object-fit: cover; }
        .meaning-area { max-width: 500px; text-align: center; opacity: 0; transition: 1s; padding: 0 1rem; }
        .meaning-area.show { opacity: 1; }
        .card-title { font-family: 'Cinzel', serif; color: var(--theme); font-size: 1.8rem; margin: 0; }
        .card-desc { color: #ccc; line-height: 1.8; margin-top: 1rem; font-size: 0.95rem; }

        /* Path Styles */
        .lesson-list { padding: 1.5rem; max-width: 600px; margin: 0 auto; }
        .lesson-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.8rem; padding: 1.8rem; margin-bottom: 1.2rem; transition: 0.3s; cursor: pointer; }
        .lesson-card:active { transform: scale(0.98); background: rgba(255,255,255,0.06); }
        .lesson-tag { color: var(--theme); font-family: 'Cinzel', serif; font-size: 0.6rem; opacity: 0.6; display: block; margin-bottom: 0.4rem; }
        .lesson-title { font-family: 'Cinzel', serif; font-size: 1.3rem; margin: 0; }

        /* Player UI */
        .player { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        .player.active { display: flex; }
        .player-bar { padding: 1.2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .prog-bg { height: 4px; background: rgba(255,255,255,0.1); flex: 1; margin: 0 1rem; border-radius: 10px; overflow: hidden; }
        .prog-fill { height: 100%; background: var(--theme); transition: 0.6s; width: 0%; }
        .player-label { font-size: 0.55rem; opacity: 0.5; font-weight: 900; min-width: 60px; text-align:right; }
        .player-body { flex: 1; overflow-y: auto; padding: 2.5rem 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .step-text { font-size: 1.15rem; line-height: 1.8; color: #ddd; max-width: 600px; font-weight: 300; white-space: pre-wrap; }
        .player-footer { padding: 1.5rem; display: flex; gap: 1rem; max-width: 600px; margin: 0 auto; width: 100%; }
        .btn { flex: 1; padding: 1.2rem; border-radius: 1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; border: none; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
        .btn-gold { background: var(--theme); color: #000; }
        .btn-ghost { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Lore Styles */
        .lore-container { padding: 2rem; max-width: 800px; margin: 0 auto; }
        .lore-section { margin-bottom: 6rem; }
        .lore-img { width: 100%; border-radius: 2rem; margin-bottom: 2rem; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        .lore-title { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--theme); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1rem; margin-bottom: 1.5rem; }
        .lore-text { color: #aaa; font-size: 1.1rem; line-height: 1.9; }

        /* Spread Grid and Viewer */
        .spread-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1.5rem; max-width: 600px; margin: 0 auto; }
        .spread-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem; padding: 1.5rem; text-align: center; transition: 0.3s; cursor: pointer; }
        .spread-item:hover { background: rgba(255,255,255,0.08); border-color: var(--theme); }
        .spread-name { font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--theme); margin-top: 0.8rem; display: block; }
        .spread-desc-small { font-size: 0.55rem; opacity: 0.5; margin-top: 0.4rem; display: block; line-height: 1.4; }

        /* Increased z-index for spread-viewer to overlay player */
        .spread-viewer { position: fixed; inset: 0; background: var(--bg); z-index: 2500; display: none; flex-direction: column; overflow-y: auto; padding-bottom: 4rem; }
        .spread-viewer.active { display: flex; animation: fadeIn 0.4s; }
        .spread-layout { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; padding: 2rem; max-width: 1000px; margin: 0 auto; }
        
        .mini-card { perspective: 1000px; width: 100px; height: 160px; cursor: help; }
        .mini-card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
        .mini-card:hover .mini-card-inner { transform: rotateY(180deg); }
        .pos-label { position: absolute; top: -25px; left: 0; width: 100%; text-align: center; font-size: 0.5rem; color: var(--theme); text-transform: uppercase; font-weight: 900; letter-spacing: 0.1em; opacity: 0.6; }
        
        @media (min-width: 600px) {
            .mini-card { width: 140px; height: 220px; }
        }

        .interpretation-box { max-width: 600px; margin: 2rem auto; padding: 2rem; background: rgba(255,255,255,0.03); border-radius: 2rem; text-align: center; border: 1px solid rgba(255,255,255,0.05); }

        /* Transitions */
        .reveal-anim { animation: revealIn 0.8s ease forwards; }
        @keyframes revealIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="app">
        <!-- Screens -->
        <div id="screen-oracle" class="screen active">
            <header class="header">
                <img src="assets/cards/logo.webp" class="logo">
                <h1>Oracle</h1>
                <p class="subtitle">Invoke Ancient Wisdom</p>
            </header>
            <div class="oracle-container">
                <div class="card-box" onclick="drawSingle()">
                    <div id="oracle-inner" class="card-inner">
                        <div class="card-side"><img src="assets/cards/back.webp"></div>
                        <div id="oracle-front" class="card-side card-front"><img id="oracle-img" src=""></div>
                    </div>
                </div>
                <div id="oracle-meaning" class="meaning-area">
                    <h2 id="oracle-title" class="card-title"></h2>
                    <p id="oracle-desc" class="card-desc"></p>
                    <button onclick="resetOracle()" class="btn btn-ghost" style="margin-top: 2rem; width: auto; padding: 0.8rem 2rem;">Seal Draw</button>
                </div>
                <p id="oracle-prompt" style="opacity: 0.3; text-transform: uppercase; font-size: 0.6rem; letter-spacing: 0.3em; margin-top: 2rem;">Tap the Void to Inquire</p>
            </div>
        </div>

        <div id="screen-path" class="screen">
            <header class="header">
                <h1>The Path</h1>
                <p class="subtitle">The Great Initiation</p>
            </header>
            <div id="path-list" class="lesson-list"></div>
        </div>

        <div id="screen-lore" class="screen">
            <header class="header">
                <h1>Lore</h1>
                <p class="subtitle">The Eternal Scroll</p>
            </header>
            <div id="lore-content" class="lore-container"></div>
        </div>

        <div id="screen-spreads" class="screen">
            <header class="header">
                <h1>Spreads</h1>
                <p class="subtitle">Sacred Geometry</p>
            </header>
            <div id="spread-list" class="spread-grid"></div>
        </div>

        <div id="screen-mastery" class="screen">
            <header class="header">
                <h1>Mastery</h1>
                <p class="subtitle">Your Soul's Evolution</p>
            </header>
            <div style="text-align: center; padding: 4rem;">
                <div id="completion-label" style="font-size: 5rem; font-family: 'Cinzel'; color: var(--theme);">0%</div>
                <p class="subtitle">Initiation Complete</p>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="nav-bottom">
            <a href="#" class="nav-item active" data-screen="oracle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                Oracle
            </a>
            <a href="#" class="nav-item" data-screen="path">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Path
            </a>
            <a href="#" class="nav-item" data-screen="spreads">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
                Spreads
            </a>
            <a href="#" class="nav-item" data-screen="lore">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                Lore
            </a>
            <a href="#" class="nav-item" data-screen="mastery">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M12 22V12"/><path d="M22 7l-10 5"/></svg>
                Mastery
            </a>
        </nav>

        <!-- Lesson Player -->
        <div id="player" class="player">
            <div class="player-bar">
                <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:2rem; cursor:pointer;">&times;</button>
                <div class="prog-bg"><div id="player-prog" class="prog-fill"></div></div>
                <div id="player-label" style="font-size:0.55rem; opacity:0.5; font-weight:900; min-width:60px; text-align:right;">STEP 1/5</div>
            </div>
            <div id="player-body" class="player-body"></div>
            <div class="player-footer">
                <button id="player-next" onclick="nextStep()" class="btn btn-gold">Continue</button>
            </div>
        </div>

        <!-- Spread Viewer Modal -->
        <div id="spread-viewer" class="spread-viewer">
            <header class="header" style="padding: 2rem;">
                <h1 id="viewer-title">Spread</h1>
                <p id="viewer-subtitle" class="subtitle" style="max-width: 600px; margin: 0.5rem auto; line-height: 1.6;"></p>
                <div style="margin-top: 1rem;">
                    <button onclick="closeSpreadViewer()" class="btn btn-ghost" style="width: auto; padding: 0.6rem 1.5rem; font-size: 0.6rem;">Return</button>
                    <button id="reinvoke-btn" class="btn btn-gold" style="width: auto; padding: 0.6rem 1.5rem; font-size: 0.6rem; margin-left: 0.5rem;">Re-Invoke</button>
                </div>
            </header>
            <div id="spread-layout" class="spread-layout"></div>
            <div id="interpretation-box" class="interpretation-box" style="display: none;">
                <h3 id="interp-card-title" style="font-family: 'Cinzel'; color: var(--theme); margin: 0 0 0.5rem;">Card Name</h3>
                <p id="interp-card-pos" class="subtitle" style="margin-bottom: 1rem;"></p>
                <div id="interp-card-desc" style="font-size: 0.9rem; color: #ccc; line-height: 1.6;"></div>
            </div>
            <p style="text-align: center; opacity: 0.3; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;">Hover to reveal • Click to interpret</p>
        </div>
    </div>

rchetype speaks to the soul's primary evolution.","de":"Der Mond represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","it":"La Luna represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","fr":"La Lune represents a major spiritual threshold. This archetype speaks to the soul's primary evolution."},"image":"assets/cards/card_18.webp","arcana":"major"},{"id":"n7tpza","title":{"en":"The Sun","es":"El Sol","de":"Die Sonne","it":"Il Sole","fr":"Le Soleil"},"meaning":{"en":"The Sun represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","es":"El Sol represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","de":"Die Sonne represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","it":"Il Sole represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","fr":"Le Soleil represents a major spiritual threshold. This archetype speaks to the soul's primary evolution."},"image":"assets/cards/card_19.webp","arcana":"major"},{"id":"eevsw","title":{"en":"Judgement","es":"El Juicio","de":"Gericht","it":"Il Juizio","fr":"Le Jugement"},"meaning":{"en":"Judgement represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","es":"El Juicio represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","de":"Gericht represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","it":"Il Juizio represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","fr":"Le Jugement represents a major spiritual threshold. This archetype speaks to the soul's primary evolution."},"image":"assets/cards/card_20.webp","arcana":"major"},{"id":"e9jtf","title":{"en":"The World","es":"El Mundo","de":"Die Welt","it":"Il Mondo","fr":"Le Monde"},"meaning":{"en":"The World represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","es":"El Mundo represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","de":"Die Welt represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","it":"Il Mondo represents a major spiritual threshold. This archetype speaks to the soul's primary evolution.","fr":"Le Monde represents a major spiritual threshold. This archetype speaks to the soul's primary evolution."},"image":"assets/cards/card_21.webp","arcana":"major"}],"backImage":"assets/cards/back.webp","coverImage":"assets/cards/cover.webp","logo":"assets/cards/logo.webp","guideSections":[{"id":"1","title":"The Oracle Unveiled","content":"Tarot is a mirrored portal into the subterranean wisdom of your subconscious.","image":null,"isAIGenerated":false},{"id":"2","title":"The Four Elements","content":"Wands (Fire), Cups (Water), Swords (Air), and Pentacles (Earth) form the pillars of human experience.","image":null,"isAIGenerated":false}]};
        const CURRICULUM = [{"id":1,"title":"The Nature of the Oracle","goal":"Set deep philosophical expectations and bridge the gap between art and spirit.","screens":[{"type":"text","content":"Welcome to the first threshold of the Arcana Path. Tarot is not a crystal ball, nor is it a rigid script of the future. It is a mirrored portal—a system of seventy-eight symbolic keys that unlock the subterranean wisdom of your own subconscious. By interacting with these images, you are not 'predicting' what will happen; you are observing the invisible currents that are already moving within you. In this sacred space, time is not linear but circular. Every card is a waypoint on a map you have already drawn but forgotten how to read.\n\nTo approach the Tarot is to engage in a dialogue with the Divine Self. It requires a suspension of the logical, linear mind and an opening of the 'Third Eye'—that part of your awareness that understands metaphor, color, and vibration more deeply than literal facts. As you move through this deck, treat each image as a guest in your house. Do not demand answers; instead, ask for an introduction. The cards do not hold power over you; they hold a reflection *of* you."},{"type":"text","content":"Every card in your deck is a vessel for an Archetype—a universal pattern of human experience that has existed since the dawn of consciousness. These are the 'Grave Images' of the human psyche. Whether it is the 'Leap of Faith' of The Fool or the 'Mastery of Resources' of a King, you are looking at fragments of your own soul's architecture. Your job as a reader is to cultivate 'Quiet Observation'—to look at the art and let it resonate with your current reality without judgment or fear. These patterns are the DNA of our shared human story.\n\nConsider the concept of Synchronicity—meaningful coincidence. When you draw a card, it is the bridge between your internal state and the external world. It is the universe providing a visual vocabulary for an emotion or a situation that previously felt wordless. You are not just 'learning' cards; you are learning to translate the language of the universe into the language of your life. This is the first step toward true spiritual sovereignty."},{"type":"interaction","interactionType":"draw","drawCount":1,"content":"Take a deep breath. Focus on the center of your chest. Draw your very first card from this digital sanctuary. Do not rush to a guidebook. Spend sixty seconds simply looking at the colors, the characters, and the atmosphere of the card. What is the *first* word that rises to your lips? That word is your personal oracle for today. Let it settle in your heart like a seed."},{"type":"reflection","prompts":["Close your eyes. If this card were a physical place, what would the temperature be? What would you hear? Is there a scent in the air?","How does the figure in the card feel about their current situation? How is that a reflection of your own hidden feelings this morning?"]},{"type":"quiz","quiz":{"question":"If the Tarot is a mirror, what happens when we look at a card we dislike?","options":["The card is wrong","We are seeing a part of ourselves we haven't yet integrated","The deck needs to be cleansed"],"correctIndex":1}}]},{"id":2,"title":"The Alchemy of Inquiry","goal":"Master the art of framing empowering questions that trigger real change.","screens":[{"type":"text","content":"The quality of your reading is directly proportional to the clarity of your question. In the Arcana Path, we avoid 'Passive Questions' like 'Will I find love?' because they rob you of your agency and turn you into a victim of fate. Instead, we move toward 'Alchemical Questions' that place you at the center of the transformation. Every inquiry should be a request for a perspective you cannot currently see. A question is a ritual; it is the intent that shapes the energy of the draw.\n\nWhen we ask 'Will this happen?', we are essentially asking if the universe is done with us. When we ask 'How can I prepare for this?', we are asserting our power to shape the outcome. The Oracle responds to active will, not idle curiosity. You are the protagonist of this story, not a bystander. By shifting your questions, you shift your reality before a single card is even touched."},{"type":"text","content":"An empowering question usually begins with 'How,' 'What,' or 'Why.' It focuses on your growth, your obstacles, and your hidden strengths. Compare: 'Will he come back?' (Passive/External) to 'What energy can I embody to heal from this transition?' (Active/Internal). The latter invites the Oracle to provide a roadmap for your soul, rather than a binary yes or no. The Tarot is a tool for evolution, not just information. It seeks to make you wiser, not just 'informed'.\n\nThink of your question as a lens. A broad, blurry question leads to a broad, blurry answer. A sharp, specific question allows the light of the Oracle to focus with laser-like precision. If you are struggling with a career choice, do not ask 'Which job should I take?'. Ask 'What will be my greatest challenge and greatest reward in Path A vs Path B?'. Give the cards the space to tell a nuanced story."},{"type":"interaction","interactionType":"question_build","drawCount":1,"content":"Think of a situation that feels heavy or stagnant in your life right now. Frame a question that starts with 'What do I need to understand about...' and draw a single card. Let this card be the lens through which you view the next 24 hours of that situation."},{"type":"reflection","prompts":["Does the card suggest an action (movement) or a realization (stillness)?","If this card were advice from a wise ancestor, what would be the first thing they'd tell you to change about your current perspective?"]},{"type":"quiz","quiz":{"question":"What is the primary function of an 'Alchemical Question'?","options":["To find out what others are thinking","To reclaim agency and seek internal wisdom","To confirm what we already believe"],"correctIndex":1}}]},{"id":3,"title":"The Macrocosm & The Microcosm","goal":"Understand the structural difference between Major and Minor Arcana.","screens":[{"type":"text","content":"The Tarot deck is divided into two distinct realms: the Major Arcana (The Great Mysteries) and the Minor Arcana (The Daily Textures). The Major Arcana consists of 22 cards that represent the 'Soul's Journey'—the massive, slow-moving shifts in destiny, life lessons, and spiritual evolution. When a Major card appears, the universe is speaking about the BIG picture. These are the gravitational forces of your life—the things that feel like 'Fate' because they operate on a level far deeper than your daily choices.\n\nMajors are the archetypal foundations. They are the 'Tectonic Plates' of your psyche. When they shift, the entire landscape of your life changes. They represent the lessons that we come to this earth to learn over lifetimes, not just weeks. If your reading is heavy with Major Arcana, you are in a period of significant spiritual initiation. Pay close attention; these moments do not come often, and their impact is eternal."},{"type":"text","content":"The Minor Arcana (56 cards) represents the day-to-day details. They are the 'micro-resonance'—the fleeting emotions, the intellectual puzzles, the creative sparks, and the material tasks that make up your week. They provide the 'how' and 'where,' while the Majors provide the 'why.' A Major card is like a season; a Minor card is like a specific afternoon in that season. They are the brushstrokes that make up the masterpiece of your experience.\n\nThe Minors are where we live most of our lives. They are the interactions at the grocery store, the email that makes us nervous, the sudden burst of inspiration in the shower. While they may seem less 'important' than the Majors, they are the testing ground for our spiritual growth. How we handle a Minor card (a small irritation) determines how we will handle a Major card (a life-altering crisis). The small things are the big things in training."},{"type":"interaction","interactionType":"filtered_draw","drawCount":2,"filters":{"arcana":"major"},"content":"Let's observe the scale difference. I will draw one Major Arcana card for your 'Spiritual Theme' and one Minor Arcana card for your 'Daily Focus.' See how they interact—the Major is the sky above you, the Minor is the path beneath your feet."},{"type":"reflection","prompts":["Does your 'Spiritual Theme' feel like it's ending a cycle or beginning a new one?","How can you bring the high wisdom of your Major card down into the practical, small task suggested by your Minor card today?"]},{"type":"quiz","quiz":{"question":"If the Tarot is a mirror, what happens when we look at a card we dislike?","options":["The card is wrong","We are seeing a part of ourselves we haven't yet integrated","The deck needs to be cleansed"],"correctIndex":1}}]},{"id":4,"title":"The Four Elemental Streams","goal":"Map the suits to the four fundamental domains of human existence.","screens":[{"type":"text","content":"The Minor Arcana is split into four suits, each corresponding to an element. Wands (Fire) are your spark, ambition, and vitality. Cups (Water) are your emotions, relationships, and intuition. Swords (Air) are your logic, communication, and the sharp edges of your mind. Pentacles (Earth) are your body, your work, and the physical world you inhabit. These are the four pillars that hold up the temple of your life.\n\nImagine these elements as states of matter within your soul. Fire is plasma—energetic, transformative, and dangerous if left unchecked. Water is liquid—flowing, receptive, and taking the shape of its container. Air is gas—invisible, pervasive, and capable of both a gentle breeze and a destructive hurricane. Earth is solid—reliable, slow-moving, and the foundation upon which all else is built. To be a Master of the Arcana is to know which element is currently flooding your temple."},{"type":"text","content":"Think of these as the 'Four Streams of Life.' If your reading is dominated by Swords, you are spending too much time in your head, perhaps over-analyzing or battling with your own thoughts. If it is all Cups, you may be drowning in emotion or nostalgia, losing your footing in reality. Balance is the goal. Each suit offers a different medicine for the soul. To understand a card, you must first understand the element it drinks from.\n\nWhen you see a card, ask: 'Which part of my life is this touching?'. Is it my bank account (Pentacles)? My heart (Cups)? My ego (Wands)? My truth (Swords)? By identifying the element, you immediately narrow down the field of interpretation. You begin to see your life not as one big mess, but as a series of interacting elemental systems that occasionally need recalibration."},{"type":"interaction","interactionType":"filtered_draw","drawCount":2,"filters":{"arcana":"minor"},"content":"Draw two Minor cards. Identify their elements immediately. Are you seeing Fire and Water (Passion vs Emotion)? Or perhaps Earth and Air (Practice vs Theory)? Observe the 'Elementary Conflict' or 'Elementary Harmony' between them."},{"type":"reflection","prompts":["Which of the four elements feels most 'dried up' or 'blocked' in your life right now?","If you had to pick one of the cards you just drew to represent your 'Weapon of Choice' for this week, which would it be and why?"]},{"type":"quiz","quiz":{"question":"A person struggling with 'imposter syndrome' and lack of confidence needs more of which element?","options":["Water (Cups)","Fire (Wands)","Air (Swords)"],"correctIndex":1}}]},{"id":5,"title":"The Geometry of Progression","goal":"Learn to read the numbers Ace through Ten as a narrative arc.","screens":[{"type":"text","content":"Within each suit, there is a numeric progression from one to ten. This is the 'Story Arc' of a situation. Aces are the pure, unmanifested seeds of potential—the 'Big Bang' of that element. Twos and Threes are the first steps, the initial plans, and the gathering of resources. Fours are stability, but often carry the risk of stagnation or boredom. Fives are the inevitable disruption—the 'Pivot of Chaos' that forces us out of our comfort zone.\n\nThe numbers are a map of time and development. If you draw an Ace, you are at the absolute beginning; the energy is high but the direction is not yet set. If you draw a Ten, you have reached the summit; the cycle is complete, and it is time to harvest the results and prepare for a new Ace. Understanding where you are in this sequence prevents you from trying to 'finish' something that has only just begun."},{"type":"text","content":"Sixes represent a return to harmony after the chaos of the Five. Sevens are about secret work, strategy, and testing your resolve. Eights are about movement and mastery—honing your craft. Nines are the 'Home Stretch,' where we face our final internal hurdles. Tens are the culmination—the absolute peak of that suit's energy, for better or worse. Every number is a necessary stage in the soul's maturation.\n\nThink of a relationship. The Ace is the first glance. The Two is the first date. The Three is the first common project. The Five is the first big fight. The Ten is the long-term commitment (or the final dissolution). By knowing the 'Geometry' of the numbers, you can tell exactly where you are in the story of any situation. You stop fighting the process and start moving with the current of the number."},{"type":"interaction","interactionType":"draw","drawCount":3,"content":"Draw three cards to represent your 'Past, Present, and Future Momentum.' Ignore the meanings for a second—just look at the numbers. Is the sequence increasing (Growing)? Decreasing (Fading)? Or jumping wildly (Turbulence)?"},{"type":"reflection","prompts":["Look at your middle card. Does the number feel like 'Too Much' or 'Not Enough' for your current energy?","If your future card has a lower number than your present card, what are you being asked to 'let go' of to return to a seed state?"]},{"type":"quiz","quiz":{"question":"Which number represents the 'Home Stretch' of a suit's journey?","options":["Four","Seven","Nine"],"correctIndex":2}}]},{"id":6,"title":"The Mirror of Reversals","goal":"Interpret the 'Inward Turn' of energy when a card appears upside down.","screens":[{"type":"text","content":"Reversed cards are not 'bad' versions of the upright cards. They represent an 'Internalized,' 'Hidden,' or 'Delayed' energy. If an upright card is a shout, a reversed card is a whisper. It often points to something you are doing to yourself, rather than something the world is doing to you. It is the shadow side, the hidden motive, or the work that must be done in private before it can be manifested in public.\n\nA reversal is a sign to slow down and look inward. It suggests that the energy of the card is blocked or misdirected. If the Sun (Joy) is reversed, it doesn't mean 'Sadness'; it means joy is present but you are struggling to feel it, or perhaps you are looking for it in the wrong places. Reversals turn the Oracle into a psychologist. They demand a deeper level of honesty than the upright cards ever will."},{"type":"text","content":"For example, an upright Three of Swords might be a public breakup or argument. Reversed, it could be the silent, internal grief that you haven't yet let yourself feel—the 'Old Wound' that still stings in the dark. Reversals invite you to stop looking 'out there' and start looking 'in here.' They are the ultimate tools for self-honesty and integration.\n\nWhen a card is reversed, ask: 'Am I resisting this energy? Is this happening inside my mind rather than in my life? Is there something I need to fix before this can turn upright?'. Often, a reversal is simply a 'not yet.' It's a reminder that the cake is still in the oven. Do not rush it. Respect the gravity of the inverted image."},{"type":"interaction","interactionType":"draw","drawCount":1,"content":"Let's invoke a card with reversals enabled. If it comes up reversed, I want you to ask: 'How is this energy already inside me, even if I'm not showing it to the world?'"},{"type":"reflection","prompts":["Does the 'Inward' version of this card feel more or less intimidating than the 'Outward' version?","What is one secret you are keeping from yourself that this card might be pointing toward?"]},{"type":"quiz","quiz":{"question":"A reversed card primarily indicates that the energy is...","options":["Evil","Internalized or temporarily blocked","Non-existent"],"correctIndex":1}}]},{"id":7,"title":"The Court of Personas","goal":"Identify the roles and personality types that inhabit your social sphere.","screens":[{"type":"text","content":"The Court Cards—Pages, Knights, Queens, and Kings—are the most human cards in the deck. They often represent specific people in your life, or more importantly, 'Sub-Personalities' within you. Pages are the students and messengers—the 'Beginner's Mind.' Knights are the activists and movers—the 'Will in Action.' Queens are the nurturers and internal masters—the 'Emotional Authority.' Kings are the leaders and external authorities—the 'Mastery of Realm.'\n\nThese 16 cards are a map of human character. They show us the different masks we wear. To meet a King of Pentacles is to meet the part of yourself that knows how to build a business or maintain a garden. To meet a Page of Cups is to meet the part of you that is vulnerable, romantic, and slightly naive. The Court is a mirror of your social and internal landscape. Who are you being today?"},{"type":"text","content":"When a Court card appears, ask: 'Am I being called to act like this person? Or am I dealing with someone who has these traits?'. A Queen of Wands is the master of her own fire—she is confident and creative. A Page of Pentacles is a humble student of the physical world. Learning the Court is about learning the 'Sacred Roles' we play in the human drama. They are the actors on the stage of your life.\n\nCourt cards can be the most difficult to read because they are so versatile. They can be a 'Who' or a 'How.' Is the King of Swords your boss? Or is he the 'Logical Mindset' you need to adopt to survive your boss? Usually, it's both. The external world and the internal world are never truly separate. The Court helps you bridge that gap by giving names and faces to the energies moving through your life."},{"type":"interaction","interactionType":"filtered_draw","drawCount":1,"filters":{"rank":["page","knight","queen","king"]},"content":"Draw a single Court card. Think of one person in your life right now who is causing you stress or confusion. Does this card describe them? If not, does it describe the role *you* need to play to resolve the situation?"},{"type":"reflection","prompts":["If you had to embody this card's energy for the next hour, how would your posture change? How would your voice sound?","What is this 'Persona' trying to teach you about boundaries?"]},{"type":"quiz","quiz":{"question":"Which Court rank represents 'Action and Movement'?","options":["Page","Knight","Queen"],"correctIndex":1}}]},{"id":8,"title":"The Syntax of Fate","goal":"Learn to synthesize two cards into a single coherent message.","screens":[{"type":"text","content":"A single Tarot card is a word. Two cards together are a sentence. This is where the magic of 'Synthesis' begins. To read Tarot is to be a translator of symbols. You must look for the 'Third Meaning'—the message that exists only in the space *between* the two cards. Does Card A cause Card B? Or is Card B the solution to Card A? This is the birth of the Oracle's voice.\n\nSynthesis is an intuitive leap. It is the moment where 1 + 1 = 3. If you see 'The Devil' (Bondage) and 'The Lovers' (Choice), the message isn't just 'bad choice.' It's 'You are choosing your own chains.' You are weaving two separate concepts into a single tapestry of meaning. This skill is what separates a student from a Master. It requires trust in your own 'First Impression'."},{"type":"text","content":"Try using 'Connector Words' like 'because,' 'but,' or 'leading to.' Example: 'The Tower' (Crisis) + 'The Star' (Hope) = 'Crisis *leading to* Hope.' Or: 'The Magician' (Action) + 'Four of Swords' (Rest) = 'Action *requires* Rest.' The cards are a dialogue. Listen to how they speak to each other. They are not static snapshots; they are a movie.\n\nLook for visual connections. Is the figure in Card A looking at the figure in Card B? Is the color red dominant in both? Do the elements (Fire/Water) fight each other? These visual clues are the 'Grammar' of the Tarot. The more you look, the more the cards will start to 'move' and 'talk' to each other, revealing a story that neither could tell alone."},{"type":"interaction","interactionType":"synthesis","drawCount":2,"content":"Draw two cards. I want you to mentally form a single sentence that combines them both. Use the word 'Therefore' in your sentence. Don't worry about being 'wrong'—trust the first story that your mind creates."},{"type":"reflection","prompts":["Which card feels like the 'Subject' and which feels like the 'Verb' in your two-card sentence?","If these two cards were characters in a movie, what would their first argument be about?"]},{"type":"quiz","quiz":{"question":"What is the 'Third Meaning' in Tarot?","options":["A secret code found in the numbers","The unique insight created by the combination of two cards","The name of the deck's creator"],"correctIndex":1}}]},{"id":9,"title":"Structuring the Void","goal":"Introduce the fundamental Spreads that give the Oracle a framework.","screens":[{"type":"text","content":"A 'Spread' is a layout where each position has a specific meaning. It provides the 'Grammar' and the 'Temporal Map' for your reading. The most famous is the 'Past, Present, Future' spread. It anchors the information in time. Without a spread, a reading can feel like a cloud of vague advice. With a spread, it becomes a surgical diagnostic tool that points directly to the problem.\n\nA spread is a boundary. And in spirituality, boundaries create freedom. By saying 'This position represents my fear,' you give the Oracle a specific channel to speak through. You are limiting the possibilities so that the truth can emerge more clearly. A good reader knows a dozen spreads, but a Master reader knows how to choose the *right* spread for the specific moment."},{"type":"text","content":"Other basic spreads include 'Problem/Solution/Outcome' or 'Mind/Body/Spirit.' The spread is your contract with the Oracle. You are saying: 'I will put a card here, and I expect it to speak about my Past.' By setting these boundaries, you actually allow for more freedom and deeper insights to emerge. It creates a 'Sacred Geometry' for the information to flow through.\n\nAs you progress, you can even design your own spreads. If you are worried about a move to a new city, you can create a 'Four Corners' spread: 1. Career prospects, 2. Social life, 3. Spiritual growth, 4. Hidden challenges. The spread is the architecture of the reading. It is the stage upon which the cards perform their dance. Without a stage, they are just wandering actors."},{"type":"interaction","interactionType":"draw","drawCount":3,"content":"Let's perform a formal 'Past, Present, Possible' spread. Focus on a specific goal you have. Draw three cards. Card 1: What foundation brought you here? Card 2: What is the current atmosphere? Card 3: Where is the momentum heading if you don't change anything?"},{"type":"reflection","prompts":["Look at the 'Possible' card. Do you like where it's heading? If not, which of the other two cards shows you what needs to be healed first?","Is there a color or symbol that appears in all three cards? What does that repeat mean to you?"]},{"type":"quiz","quiz":{"question":"Why is a spread considered a 'Contract' with the Oracle?","options":["It costs money to use","It defines exactly how the symbols will be interpreted in each position","It makes the cards more powerful"],"correctIndex":1}}]},{"id":10,"title":"The Living Grimoire","goal":"Establish a lifelong practice of observation and pattern recognition.","screens":[{"type":"text","content":"Congratulations. You have completed the first circuit of the Arcana Path. But the real learning happens now, in the wild. The only way to truly master the Tarot is to live with it. A 'Daily Draw'—drawing one card every morning and reflecting on it every evening—is the most powerful ritual you can adopt. Your life is the dictionary; the cards are the definitions. You are now a practitioner of the Sacred Art.\n\nThis is not a hobby; it is a way of seeing. You will begin to see 'The Chariot' in every successful project, and 'The Tower' in every sudden realization. The world becomes a living deck. The goal is to reach a state where you don't even need the physical cards anymore—you can read the 'vibration' of a situation using the archetypes you have studied here. This is true intuitive mastery."},{"type":"text","content":"Keep a mental journal (or a physical one if you wish). Observe the card, the day's events, and your emotional state. Over months, you will see patterns. You will realize that 'The Tower' for you might mean a sudden software crash, while for someone else, it means a realization about a relationship. Your 'Personal Glossary' is the only 'Correct' guidebook in existence. Trust your experience over any book.\n\nRemember: The Oracle is always speaking. The cards are just a way to turn up the volume. Stay humble, stay curious, and most importantly, stay honest. The Tarot will never lie to you, but you might try to lie to yourself. The cards are here to keep you on the path of truth. Go forth with your head high and your heart open to the Great Mystery."},{"type":"interaction","interactionType":"draw","drawCount":1,"content":"Draw one final card. This is your 'Seal of Completion' for this course. Fix this image in your mind. What is the one thing this card is begging you to change about your life starting right now?"},{"type":"reflection","prompts":["What was the most surprising thing you learned about yourself during these ten lessons?","What part of the deck (Majors, Suits, Numbers) still feels like a mystery to you? That is where your next journey begins."]},{"type":"quiz","quiz":{"question":"What is the ultimate goal of the Tarot student?","options":["To become famous","To develop a personal, living relationship with the archetypes in daily life","To memorize every book on the subject"],"correctIndex":1}}]},{"id":11,"title":"The Geometry of Spreads","goal":"Master 12 essential layouts to navigate any life situation with precision.","screens":[{"type":"text","content":"Now that you understand the language of the cards, you must learn the 'Sentence Structures' of the Oracle. A spread is more than a layout; it is a lens. Different situations require different geometries. In this final module, we will explore 12 fundamental spreads that range from the simple Daily Draw to the complex Yearly Wheel. Each spread serves a specific purpose in the seeker's journey.\n\nAs you practice these, notice how the meaning of a card changes based on its position. A 'Ten of Swords' in the 'Gifts' position means something very different than in the 'Obstacles' position. You are learning to read 'Context'. Master these 12 patterns, and you will never be lost in a reading again. You will have a tool for every question and a map for every territory."},{"type":"text","content":"1. **Single Card**: The Essence. Best for daily focus.\n2. **Dual Path**: Choice A vs Choice B.\n3. **Temporal Trio**: Past, Present, Future.\n4. **Elemental Balance**: Mind, Body, Spirit, Shadow.\n5. **The Mirror**: Self, Other, The Bond.\n6. **The Celtic Cross**: The 10-card classic for deep insight.\n7. **The Horseshoe**: A 7-card map of path and outcome.\n8. **The Blind Spot**: What you see, what they see, what is hidden.\n9. **Weekly Cycle**: 7 cards for the week ahead.\n10. **Yearly Wheel**: 12 cards for the months of the year.\n11. **Career Pivot**: Current role, Hidden potential, Next move.\n12. **Spiritual Alignment**: Ego vs Soul purpose."},{"type":"interaction","interactionType":"spread_library","content":"Behold the 12 Sacred Geometries. Select any spread to observe its structure before proceeding to your final reflection. Notice how each arrangement creates a different dialogue with the Oracle."},{"type":"reflection","prompts":["Which spread feels most 'natural' to your way of thinking?","Why does the Celtic Cross remain the most used spread in history? What does its shape say about human experience?"]},{"type":"quiz","quiz":{"question":"Which spread is best for comparing two potential choices?","options":["Temporal Trio","Dual Path","Yearly Wheel"],"correctIndex":1}}]}];
        const CONFIG = CLIENT_DATA.config;

        const SPREAD_METADATA = [
            { id: "single", name: "Single Essence", positions: ["The Essence"], desc: "The root vibration of this moment. A direct portal to the core theme of your inquiry." },
            { id: "dual", name: "Dual Path", positions: ["Choice A", "Choice B"], desc: "Comparing two potential trajectories. Use this when the crossroad is visible but the terrain is not." },
            { id: "temporal", name: "Temporal Trio", positions: ["Past", "Present", "Possible"], desc: "The chronological momentum of your situation. Observe how the seeds of yesterday bloom today." },
            { id: "elements", name: "Elemental Balance", positions: ["Mind (Air)", "Body (Earth)", "Spirit (Fire)", "Shadow (Water)"], desc: "Your state across the four domains. A holistic diagnostic for internal alignment." },
            { id: "mirror", name: "The Mirror", positions: ["Self", "The Other", "The Bond"], desc: "A diagnostic for any relationship. It reveals the energetic bridge between two souls." },
            { id: "celtic", name: "The Celtic Cross", positions: ["Present", "Challenge", "Goal", "Root", "Past", "Future", "Internal", "External", "Hopes", "Outcome"], desc: "The grand surgical tool for complex inquiry. 10 positions covering the entirety of your circumstance." },
            { id: "horseshoe", name: "The Horseshoe", positions: ["Past", "Present", "Hidden", "You", "Environment", "Advice", "Outcome"], desc: "A 7-card map of path and purpose. It highlights external influences and advice." },
            { id: "blindspot", name: "The Blind Spot", positions: ["Known to All", "Hidden to Self", "Known to Self", "Blind Spot"], desc: "What you see, what they see, and what stays in the dark. Essential for shadow work." },
            { id: "weekly", name: "Weekly Cycle", positions: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], desc: "A blueprint for the seven days ahead. A steady guide for the rotating wheel of the week." },
            { id: "yearly", name: "Yearly Wheel", positions: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], desc: "The 12-month rotation of destiny. An overview of the soul's seasonal evolution." },
            { id: "career", name: "Career Pivot", positions: ["Current Role", "Untapped Potential", "The Next Move"], desc: "Strategic insight for your professional life. Identifying the shift from work to vocation." },
            { id: "alignment", name: "Spiritual Alignment", positions: ["Ego Drive", "Soul Calling"], desc: "Checking if your actions match your purpose. The ultimate integrity check with the higher self." }
        ];

        let state = {
            currentLesson: null,
            currentStep: 0,
            activeSpread: null,
            progress: JSON.parse(localStorage.getItem('arcana_pwa_prog') || '{"completed": []}')
        };

        function init() {
            setupNav();
            renderPath();
            renderLore();
            renderSpreads();
            updateMastery();
        }

        function setupNav() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.onclick = (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                    document.getElementById('screen-' + item.dataset.screen).classList.add('active');
                    window.scrollTo(0,0);
                }
            });
        }

        /* Oracle Functions */
        function drawSingle() {
            const card = CLIENT_DATA.cards[Math.floor(Math.random() * CLIENT_DATA.cards.length)];
            const isReversed = CONFIG.useReversals && Math.random() > 0.5;
            
            const img = document.getElementById('oracle-img');
            img.src = card.image;
            img.style.transform = isReversed ? 'rotate(180deg)' : 'none';
            
            document.getElementById('oracle-inner').classList.add('flipped');
            document.getElementById('oracle-meaning').classList.add('show');
            document.getElementById('oracle-prompt').style.opacity = '0';
            
            document.getElementById('oracle-title').innerText = card.title[CONFIG.defaultLanguage] + (isReversed ? ' (Reversed)' : '');
            document.getElementById('oracle-desc').innerText = card.meaning[CONFIG.defaultLanguage];
        }

        function resetOracle() {
            document.getElementById('oracle-inner').classList.remove('flipped');
            document.getElementById('oracle-meaning').classList.remove('show');
            setTimeout(() => {
                document.getElementById('oracle-prompt').style.opacity = '0.3';
            }, 800);
        }

        /* Path Functions */
        function renderPath() {
            const list = document.getElementById('path-list');
            list.innerHTML = CURRICULUM.map(lesson => `
                <div class="lesson-card" onclick="startLesson(${lesson.id})">
                    <span class="lesson-tag">INITIATION ${lesson.id} ${state.progress.completed.includes(lesson.id) ? '✓' : ''}</span>
                    <h3 class="lesson-title">${lesson.title}</h3>
                </div>
            `).join('');
        }

        function startLesson(id) {
            state.currentLesson = CURRICULUM.find(l => l.id === id);
            state.currentStep = 0;
            document.getElementById('player').classList.add('active');
            renderStep();
        }

        function renderStep() {
            const step = state.currentLesson.screens[state.currentStep];
            const body = document.getElementById('player-body');
            const nextBtn = document.getElementById('player-next');
            
            const prog = ((state.currentStep + 1) / state.currentLesson.screens.length) * 100;
            document.getElementById('player-prog').style.width = prog + '%';
            document.getElementById('player-label').innerText = `STEP ${state.currentStep + 1} / ${state.currentLesson.screens.length}`;

            body.innerHTML = '';
            nextBtn.innerText = state.currentStep === state.currentLesson.screens.length - 1 ? 'Manifest Completion' : 'Continue';
            nextBtn.style.display = 'block';

            if (step.type === 'text') {
                body.innerHTML = `<div class="step-text">${step.content}</div>`;
            } else if (step.type === 'interaction') {
                if (step.interactionType === 'spread_library') {
                    body.innerHTML = `
                        <div class="step-text" style="margin-bottom:2rem;">${step.content}</div>
                        <div class="spread-grid" style="width:100%; max-width:500px; padding:0; margin-bottom: 2rem;">
                            ${SPREAD_METADATA.map(s => `
                                <div class="spread-item" onclick="invokeSpread('${s.id}')" style="padding:1rem;">
                                    <span class="spread-name" style="font-size:0.7rem;">${s.name}</span>
                                    <span class="spread-desc-small">${s.desc}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    body.innerHTML = `
                        <div class="step-text" style="margin-bottom:2rem;">${step.content}</div>
                        <div class="card-box" onclick="handleLessonDraw(this)">
                            <div class="card-inner">
                                <div class="card-side"><img src="${CLIENT_DATA.backImage}"></div>
                                <div class="card-side card-front"><img src=""></div>
                            </div>
                        </div>
                    `;
                }
            } else if (step.type === 'reflection') {
                body.innerHTML = `
                    <div class="step-text" style="color:var(--theme); font-family:'Cinzel'; font-weight:700; margin-bottom:2rem;">The Oracle's Reflection</div>
                    ${step.prompts.map(p => `<div class="step-text" style="margin-bottom:1.5rem; font-style:italic;">${p}</div>`).join('')}
                    <div class="step-text" style="font-size:0.7rem; opacity:0.5; margin-top:2rem;">Hold these thoughts in your center before moving forward.</div>
                `;
            } else if (step.type === 'quiz') {
                body.innerHTML = `
                    <div class="step-text" style="margin-bottom:2rem;">${step.quiz.question}</div>
                    <div id="quiz-options" style="display:flex; flex-direction:column; gap:1rem; width:100%; max-width:400px;">
                        ${step.quiz.options.map((opt, i) => `
                            <button class="btn btn-ghost" onclick="checkQuiz(${i}, ${step.quiz.correctIndex}, this)">${opt}</button>
                        `).join('')}
                    </div>
                    <div id="quiz-feedback" class="step-text reveal-anim" style="margin-top:2rem; display:none; font-family:'Cinzel'; color:var(--theme); font-weight:700;"></div>
                `;
                nextBtn.style.display = 'none';
            }
        }

        window.handleLessonDraw = (el) => {
            const inner = el.querySelector('.card-inner');
            if (inner.classList.contains('flipped')) return;
            const card = CLIENT_DATA.cards[Math.floor(Math.random() * CLIENT_DATA.cards.length)];
            el.querySelector('.card-front img').src = card.image;
            inner.classList.add('flipped');
        };

        window.checkQuiz = (sel, cor, el) => {
            const feedback = document.getElementById('quiz-feedback');
            const nextBtn = document.getElementById('player-next');
            const buttons = document.querySelectorAll('#quiz-options button');
            
            buttons.forEach(b => b.disabled = true);

            if (sel === cor) {
                el.style.borderColor = 'var(--theme)';
                el.style.background = 'rgba(255,193,7,0.1)';
                feedback.innerText = "✓ The Seal is Revealed. You have grasped the Sacred Truth.";
                feedback.style.display = 'block';
                nextBtn.style.display = 'block';
                nextBtn.classList.add('reveal-anim');
            } else {
                el.style.borderColor = '#ff4444';
                el.style.background = 'rgba(255,68,68,0.1)';
                feedback.innerText = "The vision is clouded. Meditate further.";
                feedback.style.color = '#ff4444';
                feedback.style.display = 'block';
                
                setTimeout(() => {
                    buttons.forEach(b => {
                        b.disabled = false;
                        b.style.borderColor = 'rgba(255,255,255,0.1)';
                        b.style.background = 'rgba(255,255,255,0.05)';
                    });
                    feedback.style.display = 'none';
                }, 2000);
            }
        };

        function nextStep() {
            if (state.currentStep < state.currentLesson.screens.length - 1) {
                state.currentStep++;
                renderStep();
            } else {
                finishLesson();
            }
        }

        function finishLesson() {
            if (!state.progress.completed.includes(state.currentLesson.id)) {
                state.progress.completed.push(state.currentLesson.id);
                localStorage.setItem('arcana_pwa_prog', JSON.stringify(state.progress));
            }
            closePlayer();
            renderPath();
            updateMastery();
        }

        function closePlayer() {
            document.getElementById('player').classList.remove('active');
        }

        /* Lore Functions */
        function renderLore() {
            const cont = document.getElementById('lore-content');
            cont.innerHTML = CLIENT_DATA.guideSections.map((s, i) => `
                <div class="lore-section">
                    ${s.image ? `<img src="assets/guide/section_${i}.webp" class="lore-img">` : ''}
                    <h2 class="lore-title">${s.title}</h2>
                    <div class="lore-text">${s.content.replace(/\\n/g, '<br>')}</div>
                </div>
            `).join('') + `
                <div class="lore-section">
                    <h2 class="lore-title">The Pantheon</h2>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                        ${CLIENT_DATA.cards.map(c => `
                            <div style="text-align:center;">
                                <img src="${c.image}" style="width:100%; border-radius:1rem;">
                                <div style="font-family:'Cinzel'; font-size:0.7rem; color:var(--theme); margin-top:0.5rem;">${c.title[CONFIG.defaultLanguage]}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        /* Spreads Functions */
        function renderSpreads() {
            const list = document.getElementById('spread-list');
            list.innerHTML = SPREAD_METADATA.map(s => `
                <div class="spread-item" onclick="invokeSpread('${s.id}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--theme)" stroke-width="1" style="width:40px; height:40px;"><circle cx="12" cy="12" r="10"/><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
                    <span class="spread-name">${s.name}</span>
                    <span class="spread-desc-small" style="max-width: 150px; margin: 0.5rem auto;">${s.desc.substring(0, 45)}...</span>
                </div>
            `).join('');
        }

        function invokeSpread(id) {
            const spread = SPREAD_METADATA.find(s => s.id === id);
            state.activeSpread = spread;
            document.getElementById('viewer-title').innerText = spread.name;
            document.getElementById('viewer-subtitle').innerText = spread.desc;
            document.getElementById('spread-viewer').classList.add('active');
            dealSpread(spread);
        }

        function dealSpread(spread) {
            const layout = document.getElementById('spread-layout');
            layout.innerHTML = '';
            document.getElementById('interpretation-box').style.display = 'none';

            spread.positions.forEach((pos, i) => {
                const card = CLIENT_DATA.cards[Math.floor(Math.random() * CLIENT_DATA.cards.length)];
                const isReversed = CONFIG.useReversals && Math.random() > 0.5;
                
                const cardHtml = `
                    <div class="mini-card" onclick="interpretCard(${i}, '${card.id}', ${isReversed}, '${pos}')">
                        <div class="pos-label">${pos}</div>
                        <div class="mini-card-inner">
                            <div class="card-side"><img src="${CLIENT_DATA.backImage}"></div>
                            <div class="card-side card-front">
                                <img src="${card.image}" style="${isReversed ? 'transform: rotate(180deg);' : ''}">
                            </div>
                        </div>
                    </div>
                `;
                layout.insertAdjacentHTML('beforeend', cardHtml);
            });
            
            document.getElementById('reinvoke-btn').onclick = () => dealSpread(spread);
        }

        function interpretCard(index, cardId, isReversed, posName) {
            const card = CLIENT_DATA.cards.find(c => c.id === cardId);
            const box = document.getElementById('interpretation-box');
            box.style.display = 'block';
            box.scrollIntoView({ behavior: 'smooth', block: 'end' });
            
            const title = card.title[CONFIG.defaultLanguage].toLowerCase();
            let posMeaning = "This position defines how the archetype manifests in this specific domain of your inquiry.";
            
            // Rich contextual logic for position explanation
            if (posName.includes("Future") || posName.includes("Outcome") || posName.includes("Possible")) {
                posMeaning = `The energy of ${title} is coalescing into your future trajectory. It represents the potential conclusion of your current momentum.`;
            } else if (posName.includes("Past") || posName.includes("Root")) {
                posMeaning = `Your foundation is built upon the lessons of ${title}. This is the 'Soil' from which your present situation emerged.`;
            } else if (posName.includes("Challenge") || posName.includes("Obstacle") || posName.includes("Shadow")) {
                posMeaning = `${title} presents a friction point or hidden influence that requires your conscious integration to resolve the conflict.`;
            } else if (posName.includes("Advice") || posName.includes("Gifts")) {
                posMeaning = `The Oracle suggests leaning into the vibration of ${title} as a tool for resolution and empowerment.`;
            } else if (posName.includes("Self") || posName.includes("You")) {
                posMeaning = `This represents your current internal state. You are embodying the vibration of ${title} at this very moment.`;
            } else if (posName.includes("Environment") || posName.includes("External")) {
                posMeaning = `This card reflects the outside world or people influencing you. ${title} is the current tone of your external circumstances.`;
            } else if (posName.includes("Mind") || posName.includes("Thought")) {
                posMeaning = `Your mental landscape is currently dominated by ${title}. This is how you are thinking about the situation.`;
            } else if (posName.includes("Heart") || posName.includes("Emotion") || posName.includes("Shadow")) {
                posMeaning = `Beneath the surface, your feelings are resonating with ${title}. This is the emotional current driving your experience.`;
            }

            document.getElementById('interp-card-title').innerText = card.title[CONFIG.defaultLanguage] + (isReversed ? ' (Reversed)' : '');
            document.getElementById('interp-card-pos').innerText = "In position: " + posName;
            document.getElementById('interp-card-desc').innerHTML = `
                <div style="margin-bottom:1.5rem; padding:1rem; border-left:2px solid var(--theme); background:rgba(255,193,7,0.05);">
                    <p style="font-style:italic; color:var(--theme); font-weight:600; font-size: 0.95rem; margin:0;">${posMeaning}</p>
                </div>
                <div style="height:1px; background:rgba(255,255,255,0.1); margin-bottom:1.5rem;"></div>
                <div style="text-align:left;">
                    <p style="margin-top:0;">${card.meaning[CONFIG.defaultLanguage]}</p>
                </div>
            `;
        }

        function closeSpreadViewer() {
            document.getElementById('spread-viewer').classList.remove('active');
            state.activeSpread = null;
        }

        function updateMastery() {
            const pct = Math.round((state.progress.completed.length / CURRICULUM.length) * 100);
            document.getElementById('completion-label').innerText = pct + '%';
        }

        init();
    </script>
</body>
</html>
