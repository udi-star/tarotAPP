<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcana Path Studio | Learning Guide</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFC107">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --theme: #FFC107; --bg: #0a0a0c; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; -webkit-tap-highlight-color: transparent; }
        #app { min-height: 100vh; display: flex; flex-direction: column; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); padding: 1.2rem 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #555; text-decoration: none; font-size: 0.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.3s; }
        .nav-item.active { color: var(--theme); }
        .screen { padding: 2rem; padding-bottom: 7rem; flex: 1; display: none; }
        .screen.active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .lesson-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 2rem; padding: 2rem; margin-bottom: 1.5rem; transition: 0.4s; cursor: pointer; position: relative; overflow: hidden; }
        .lesson-card:hover { border-color: var(--theme); transform: scale(1.02); background: rgba(255,255,255,0.06); }
        .lesson-num { color: var(--theme); font-family: 'Cinzel', serif; font-size: 0.7rem; margin-bottom: 0.5rem; display: block; opacity: 0.6; }
        .lesson-title { font-family: 'Cinzel', serif; font-size: 1.4rem; margin: 0; letter-spacing: 0.05em; }
        
        .header { text-align: center; padding: 5rem 2rem; }
        .header h1 { font-family: 'Cinzel', serif; color: var(--theme); font-size: 2.2rem; letter-spacing: 0.2em; margin-bottom: 0.5rem; }
        .pwa-logo { max-width: 80px; margin: 0 auto 1.5rem; display: block; }
        
        .player { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: none; flex-direction: column; }
        .player.active { display: flex; }
        .player-header { padding: 1.5rem; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.3); }
        .player-close { background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.1); flex: 1; margin: 0 1.5rem; border-radius: 10px; position: relative; overflow: hidden; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--theme); transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); width: 0%; }
        
        .step-content { flex: 1; overflow-y: auto; padding: 3rem 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .step-text { font-size: 1.25rem; line-height: 1.7; max-width: 600px; color: #ddd; font-weight: 300; }
        .footer-btns { padding: 2rem; display: flex; gap: 1rem; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .btn { flex: 1; padding: 1.4rem; border-radius: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer; transition: 0.3s; border: none; font-size: 0.8rem; }
        .btn-primary { background: var(--theme); color: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }

        .deck { width: 180px; height: 280px; position: relative; cursor: pointer; transition: 0.4s; margin-top: 2rem; }
        .deck img { width: 100%; height: 100%; object-fit: cover; border-radius: 1.2rem; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .deck:active { transform: scale(0.95); }
        
        .card-result { width: 220px; height: 350px; perspective: 1500px; margin: 1rem auto; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; cursor: pointer; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-back { background: #111; border: 1px solid rgba(255,255,255,0.1); }
        .card-front { transform: rotateY(180deg); background: #000; }
        .card-front img, .card-back img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="app">
        <div id="screen-learn" class="screen active">
            <header class="header">
                <img src="assets/cards/logo.webp" class="pwa-logo" alt="Logo">
                <h1>Arcana Path</h1>
                <p style="opacity:0.4; text-transform:uppercase; letter-spacing:0.4em; font-size:0.6rem; margin-top:1rem;">Your Journey Through Tarot</p>
            </header>
            <div id="lesson-list" style="max-width: 600px; margin: 0 auto;"></div>
        </div>

        <div id="screen-journal" class="screen">
            <h2 style="font-family:'Cinzel'; color:var(--theme); text-align:center; margin-top: 4rem;">Sacred Records</h2>
            <div id="journal-entries" style="margin-top:2rem; text-align:center; opacity:0.3;">
                <p>Your journey is just beginning.</p>
            </div>
        </div>

        <div id="screen-progress" class="screen">
          <h2 style="font-family:'Cinzel'; color:var(--theme); text-align:center; margin-top: 4rem;">Mastery Bloom</h2>
          <div id="mastery-stats" style="text-align:center; padding: 4rem 2rem;">
            <div style="font-size:5rem; font-weight:900; color:var(--theme); font-family:'Cinzel';" id="completion-percent">0%</div>
            <p style="opacity:0.4; text-transform:uppercase; letter-spacing:0.3em; font-size:0.7rem; margin-top: 1rem;">Curriculum Completed</p>
          </div>
        </div>

        <nav class="nav-bottom">
            <a href="#" class="nav-item active" data-screen="learn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M8 6h10"/><path d="M8 10h10"/><path d="M8 14h10"/></svg>
                Learn
            </a>
            <a href="#" class="nav-item" data-screen="journal">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Journal
            </a>
            <a href="#" class="nav-item" data-screen="progress">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                Progress
            </a>
        </nav>

        <div id="player" class="player">
            <div class="player-header">
                <button class="player-close">&times;</button>
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                <div id="step-label" style="font-size:0.55rem; opacity:0.5; font-weight:900; min-width:60px; text-align:right;">STEP 1/5</div>
            </div>
            <div id="step-container" class="step-content"></div>
            <div class="footer-btns">
                <button id="btn-next" class="btn btn-primary">Continue</button>
            </div>
        </div>
    </div>

        const DECK = CLIENT_DATA.cards;
        const CURRICULUM = [{"id":1,"title":"The Nature of the Oracle","goal":"Set deep philosophical expectations and bridge the gap between art and spirit.","screens":[{"type":"text","content":"Welcome to the first threshold of the Arcana Path. Tarot is not a crystal ball, nor is it a rigid script of the future. It is a mirrored portal—a system of seventy-eight symbolic keys that unlock the subterranean wisdom of your own subconscious. By interacting with these images, you are not 'predicting' what will happen; you are observing the invisible currents that are already moving within you."},{"type":"text","content":"Every card in your deck is a vessel for an Archetype—a universal pattern of human experience that has existed since the dawn of consciousness. Whether it is the 'Leap of Faith' of The Fool or the 'Mastery of Resources' of a King, you are looking at parts of yourself. Your job as a reader is to cultivate 'Quiet Observation'—to look at the art and let it resonate with your current reality without judgment or fear."},{"type":"interaction","interactionType":"draw","drawCount":1,"content":"Take a deep breath. Focus on the center of your chest. Draw your very first card from this digital sanctuary. Do not rush to a guidebook. Spend sixty seconds simply looking at the colors, the characters, and the atmosphere of the card. What is the *first* word that rises to your lips? That word is your oracle for today."},{"type":"reflection","prompts":["Close your eyes. If this card were a physical place, what would the temperature be? What would you hear?","How does the figure in the card feel about their current situation? How is that a reflection of your own feelings this morning?"]},{"type":"quiz","quiz":{"question":"Divination is best described as the art of...","options":["Forcing the future to reveal itself","Deep reflection and identifying internal patterns","Escaping the responsibility of choice"],"correctIndex":1}}]},{"id":2,"title":"The Alchemy of Inquiry","goal":"Master the art of framing empowering questions that trigger real change.","screens":[{"type":"text","content":"The quality of your reading is directly proportional to the clarity of your question. In the Arcana Path, we avoid 'Passive Questions' like 'Will I find love?' because they rob you of your agency. Instead, we move toward 'Alchemical Questions' that place you at the center of the transformation. Every inquiry should be a request for a perspective you cannot currently see."},{"type":"text","content":"An empowering question usually begins with 'How,' 'What,' or 'Why.' It focuses on your growth, your obstacles, and your hidden strengths. Compare: 'Will he come back?' (Passive/External) to 'What energy can I embody to heal from this transition?' (Active/Internal). The latter invites the Oracle to provide a roadmap for your soul, rather than a binary yes or no."},{"type":"interaction","interactionType":"question_build","drawCount":1,"content":"Think of a situation that feels heavy or stagnant in your life right now. Frame a question that starts with 'What do I need to understand about...' and draw a single card. Let this card be the lens through which you view the next 24 hours of that situation."},{"type":"reflection","prompts":["Does the card you drew suggest an action (movement) or a realization (stillness)?","If this card were advice from a wise ancestor, what would be the first thing they'd tell you to change?"]},{"type":"quiz","quiz":{"question":"Why do we avoid 'Yes/No' questions in serious Tarot study?","options":["Because the cards are too complex for binary answers","Because it limits the depth of the dialogue between self and spirit","All of the above"],"correctIndex":2}}]},{"id":3,"title":"The Macrocosm & The Microcosm","goal":"Understand the structural difference between Major and Minor Arcana.","screens":[{"type":"text","content":"The Tarot deck is divided into two distinct realms: the Major Arcana (The Great Mysteries) and the Minor Arcana (The Daily Textures). The Major Arcana consists of 22 cards that represent the 'Soul's Journey'—the massive, slow-moving shifts in destiny, life lessons, and spiritual evolution. When a Major card appears, the universe is speaking about the BIG picture."},{"type":"text","content":"The Minor Arcana (56 cards) represents the day-to-day details. They are the 'micro-resonance'—the fleeting emotions, the intellectual puzzles, the creative sparks, and the material tasks that make up your week. They provide the 'how' and 'where,' while the Majors provide the 'why.' A Major card is like a season; a Minor card is like a specific afternoon in that season."},{"type":"interaction","interactionType":"filtered_draw","drawCount":2,"filters":{"arcana":"major"},"content":"Let's observe the scale difference. I will draw one Major Arcana card for your 'Spiritual Theme' and one Minor Arcana card for your 'Daily Focus.' See how they interact—the Major is the sky above you, the Minor is the path beneath your feet."},{"type":"reflection","prompts":["Does your 'Spiritual Theme' feel like it's ending a cycle or beginning a new one?","How can you bring the high wisdom of your Major card down into the practical task suggested by your Minor card?"]}]},{"id":4,"title":"The Four Elemental Streams","goal":"Map the suits to the four fundamental domains of human existence.","screens":[{"type":"text","content":"The Minor Arcana is split into four suits, each corresponding to an element. Wands (Fire) are your spark, ambition, and vitality. Cups (Water) are your emotions, relationships, and intuition. Swords (Air) are your logic, communication, and the sharp edges of your mind. Pentacles (Earth) are your body, your work, and the physical world you inhabit."},{"type":"text","content":"Think of these as the 'Four Streams of Life.' If your reading is dominated by Swords, you are spending too much time in your head. If it is all Cups, you may be drowning in emotion. Balance is the goal of the Arcana master. Each suit offers a different medicine for the soul. To understand a card, you must first understand the element it drinks from."},{"type":"interaction","interactionType":"filtered_draw","drawCount":2,"filters":{"arcana":"minor"},"content":"Draw two Minor cards. Identify their elements immediately. Are you seeing Fire and Water (Passion vs Emotion)? Or perhaps Earth and Air (Practice vs Theory)? Observe the 'Elementary Conflict' or 'Elementary Harmony' between them."},{"type":"reflection","prompts":["Which of the four elements feels most 'dried up' in your life right now?","If you had to pick one of the cards you just drew to represent your 'Weapon of Choice' for this week, which would it be?"]}]},{"id":5,"title":"The Geometry of Progression","goal":"Learn to read the numbers Ace through Ten as a narrative arc.","screens":[{"type":"text","content":"Within each suit, there is a numeric progression from one to ten. This is the 'Story Arc' of a situation. Aces are the pure, unmanifested seeds of potential. Twos and Threes are the first steps and plans. Fours are stability (or stagnation). Fives are the inevitable disruption—the 'Pivot of Chaos.' Tens are the culmination—the absolute peak of that suit's energy."},{"type":"text","content":"When you see a card, look at its number. Is it an Ace (The Beginning)? A Five (The Conflict)? Or a Nine (The Near-Completion)? Knowing where you are in the sequence allows you to manage your expectations. You cannot force a Ten when you are still in the energy of a Two. Patience is the secret lesson of the numeric cards."},{"type":"interaction","interactionType":"draw","drawCount":3,"content":"Draw three cards to represent your 'Past, Present, and Future Momentum.' Ignore the meanings for a second—just look at the numbers. Is the sequence increasing (Growing)? Decreasing (Fading)? Or jumping wildly (Turbulence)?"},{"type":"quiz","quiz":{"question":"In the narrative of Tarot, the number FIVE usually signals...","options":["A peaceful resolution of all problems","A necessary friction that forces growth or change","The total end of the suit's journey"],"correctIndex":1}}]},{"id":6,"title":"The Mirror of Reversals","goal":"Interpret the 'Inward Turn' of energy when a card appears upside down.","screens":[{"type":"text","content":"Reversed cards are not 'bad' versions of the upright cards. They represent an 'Internalized' or 'Delayed' energy. If an upright card is a shout, a reversed card is a whisper. It often points to something you are doing to yourself, rather than something the world is doing to you. It is the shadow side, the hidden motive, or the work that must be done in private."},{"type":"text","content":"For example, an upright Three of Swords might be a public breakup or argument. Reversed, it could be the silent, internal grief that you haven't yet let yourself feel. Reversals invite you to stop looking 'out there' and start looking 'in here.' They are the ultimate tools for self-honesty."},{"type":"interaction","interactionType":"draw","drawCount":1,"content":"Let's invoke a card with reversals enabled. If it comes up reversed, I want you to ask: 'How is this energy already inside me, even if I'm not showing it to the world?'"},{"type":"reflection","prompts":["Does the 'Inward' version of this card feel more or less intimidating than the 'Outward' version?","What is one secret you are keeping from yourself that this card might be pointing toward?"]}]},{"id":7,"title":"The Court of Personas","goal":"Identify the roles and personality types that inhabit your social sphere.","screens":[{"type":"text","content":"The Court Cards—Pages, Knights, Queens, and Kings—are the most human cards in the deck. They often represent specific people in your life, or more importantly, 'Sub-Personalities' within you. Pages are the students and messengers. Knights are the activists and movers. Queens are the nurturers and internal masters. Kings are the leaders and external authorities."},{"type":"text","content":"When a Court card appears, ask: 'Am I being called to act like this person? Or am I dealing with someone who has these traits?' A Queen of Wands is the master of her own fire—she is confident and creative. A Page of Pentacles is a humble student of the physical world. Learning the Court is about learning the 'Sacred Roles' we play in the human drama."},{"type":"interaction","interactionType":"filtered_draw","drawCount":1,"filters":{"rank":["page","knight","queen","king"]},"content":"Draw a single Court card. Think of one person in your life right now who is causing you stress or confusion. Does this card describe them? If not, does it describe the role *you* need to play to resolve the situation?"},{"type":"reflection","prompts":["If you had to embody this card's energy for the next hour, how would your posture change? How would your voice sound?","What is this 'Persona' trying to teach you about boundaries?"]}]},{"id":8,"title":"The Syntax of Fate","goal":"Learn to synthesize two cards into a single coherent message.","screens":[{"type":"text","content":"A single Tarot card is a word. Two cards together are a sentence. This is where the magic of 'Synthesis' begins. To read Tarot is to be a translator of symbols. You must look for the 'Third Meaning'—the message that exists only in the space *between* the two cards. Does Card A cause Card B? Or is Card B the solution to Card A?"},{"type":"text","content":"Try using 'Connector Words' like 'because,' 'but,' or 'leading to.' Example: 'The Tower' (Crisis) + 'The Star' (Hope) = 'Crisis *leading to* Hope.' Or: 'The Magician' (Action) + 'Four of Swords' (Rest) = 'Action *requires* Rest.' The cards are a dialogue. Listen to how they speak to each other."},{"type":"interaction","interactionType":"synthesis","drawCount":2,"content":"Draw two cards. I want you to write a single sentence that combines them both. Use the word 'Therefore' in your sentence. Don't worry about being 'wrong'—trust the first story that your mind creates."},{"type":"reflection","prompts":["Which card feels like the 'Subject' and which feels like the 'Verb'?","If these two cards were characters in a movie, what would their first argument be about?"]}]},{"id":9,"title":"Structuring the Void","goal":"Introduce the fundamental Spreads that give the Oracle a framework.","screens":[{"type":"text","content":"A 'Spread' is a layout where each position has a specific meaning. It provides the 'Grammar' for your reading. The most famous is the 'Past, Present, Future' spread. It anchors the information in time. Without a spread, a reading can feel like a cloud of vague advice. With a spread, it becomes a surgical diagnostic tool."},{"type":"text","content":"Other basic spreads include 'Problem/Solution/Outcome' or 'Mind/Body/Spirit.' The spread is your contract with the Oracle. You are saying: 'I will put a card here, and I expect it to speak about my Past.' By setting these boundaries, you actually allow for more freedom and deeper insights to emerge."},{"type":"interaction","interactionType":"draw","drawCount":3,"content":"Let's perform a formal 'Past, Present, Possible' spread. Focus on a specific goal you have. Draw three cards. Card 1: What foundation brought you here? Card 2: What is the current atmosphere? Card 3: Where is the momentum heading if you don't change anything?"},{"type":"reflection","prompts":["Look at the 'Possible' card. Do you like where it's heading? If not, which of the other two cards shows you what needs to be healed first?","Is there a color that appears in all three cards? What does that color mean to you?"]}]},{"id":10,"title":"The Living Grimoire","goal":"Establish a lifelong practice of journaling and observation.","screens":[{"type":"text","content":"Congratulations. You have completed the first circuit of the Arcana Path. But the real learning happens now, in the wild. The only way to truly master the Tarot is to live with it. A 'Daily Draw'—drawing one card every morning and reflecting on it every evening—is the most powerful ritual you can adopt. Your life is the dictionary; the cards are the definitions."},{"type":"text","content":"Keep a journal. Record the card, the day's events, and your emotional state. Over months, you will see patterns. You will realize that 'The Tower' for you might mean a sudden software crash, while for someone else, it means a realization about a relationship. Your 'Personal Glossary' is the only 'Correct' guidebook in existence."},{"type":"interaction","interactionType":"draw","drawCount":1,"content":"Draw one final card. This is your 'Seal of Completion' for this course. Write down one promise you want to make to your future self regarding your spiritual growth. Keep this card in your mind for the rest of the week."},{"type":"reflection","prompts":["What was the most surprising thing you learned about yourself during these ten lessons?","What part of the deck (Majors, Suits, Numbers) still feels like a mystery to you? That is where your next journey begins."]}]}];
        const CONFIG = CLIENT_DATA.config;
        
        let state = {
          currentLesson: null,
          currentStep: 0,
          progress: JSON.parse(localStorage.getItem('arcana_progress') || '{"completed":[], "journal":[]}'),
        };

        function init() {
          renderLessons();
          setupNav();
          updateProgressUI();
        }

        function setupNav() {
          document.querySelectorAll('.nav-item').forEach(item => {
            item.onclick = (e) => {
              e.preventDefault();
              document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
              item.classList.add('active');
              document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
              document.getElementById('screen-' + item.dataset.screen).classList.add('active');
            }
          });
        }

        function renderLessons() {
          const list = document.getElementById('lesson-list');
          list.innerHTML = CURRICULUM.map(lesson => {
            const isCompleted = state.progress.completed.includes(lesson.id);
            return `
              <div class="lesson-card" onclick="startLesson(${lesson.id})">
                <span class="lesson-num">LESSON ${lesson.id} ${isCompleted ? '✓' : ''}</span>
                <h3 class="lesson-title">${lesson.title}</h3>
                <p style="opacity:0.5; font-size:0.85rem; margin-top:0.7rem; line-height:1.5;">${lesson.goal}</p>
              </div>
            `;
          }).join('');
        }

        function startLesson(id) {
          state.currentLesson = CURRICULUM.find(l => l.id === id);
          state.currentStep = 0;
          document.getElementById('player').classList.add('active');
          renderStep();
        }

        function renderStep() {
          const step = state.currentLesson.screens[state.currentStep];
          const container = document.getElementById('step-container');
          const nextBtn = document.getElementById('btn-next');
          
          const progressPercent = ((state.currentStep + 1) / state.currentLesson.screens.length) * 100;
          document.getElementById('progress-fill').style.width = progressPercent + '%';
          document.getElementById('step-label').innerText = `STEP ${state.currentStep + 1} / ${state.currentLesson.screens.length}`;

          container.innerHTML = "";
          nextBtn.style.display = 'block';
          nextBtn.innerText = state.currentStep === state.currentLesson.screens.length - 1 ? 'Manifest Completion' : 'Continue';

          if (step.type === 'text') {
            container.innerHTML = `<div class="step-text">${step.content}</div>`;
          } else if (step.type === 'interaction') {
            container.innerHTML = `
              <div class="step-text" style="margin-bottom:1rem;">${step.content}</div>
              <div id="interaction-zone">
                <div class="deck" onclick="handleDraw()">
                  <img src="${CLIENT_DATA.backImage}">
                </div>
              </div>
            `;
          } else if (step.type === 'reflection') {
            container.innerHTML = `
              <div style="width:100%; max-width:500px;">
                <h4 style="color:var(--theme); font-family:'Cinzel'; margin-bottom:1.5rem;">Reflection</h4>
                ${step.prompts.map(p => `<p style="font-size:1.1rem; color:#fff; margin-bottom:1rem; opacity:0.8;">${p}</p>`).join('')}
                <textarea style="width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:1rem; padding:1.2rem; color:#fff; min-height:150px; font-family:inherit; font-size:1rem;" placeholder="Record your inner truth..."></textarea>
              </div>
            `;
          } else if (step.type === 'quiz') {
            container.innerHTML = `
              <div class="step-text" style="margin-bottom:3rem;">${step.quiz.question}</div>
              <div style="display:flex; flex-direction:column; gap:1.2rem; width:100%; max-width:400px;">
                ${step.quiz.options.map((opt, i) => `
                  <button class="btn btn-secondary" onclick="checkQuiz(${i}, ${step.quiz.correctIndex})">${opt}</button>
                `).join('')}
              </div>
            `;
            nextBtn.style.display = 'none';
          }
        }

        window.handleDraw = () => {
          const zone = document.getElementById('interaction-zone');
          const randomCard = DECK[Math.floor(Math.random() * DECK.length)];
          const cardIdx = DECK.indexOf(randomCard);
          
          zone.innerHTML = `
            <div class="card-result">
              <div class="card-inner" id="card-reveal">
                <div class="card-back"><img src="${CLIENT_DATA.backImage}"></div>
                <div class="card-front"><img src="${randomCard.image}"></div>
              </div>
            </div>
            <div id="card-meaning" style="opacity:0; transition:1.2s; margin-top:2rem;">
              <h4 style="color:var(--theme); font-family:'Cinzel'; margin:0; font-size:1.5rem; letter-spacing:0.1em;">${randomCard.title[CONFIG.defaultLanguage]}</h4>
              <p style="font-size:1rem; opacity:0.6; margin-top:1rem; line-height:1.6;">${randomCard.meaning[CONFIG.defaultLanguage].split('\n')[0]}</p>
            </div>
          `;
          
          setTimeout(() => {
            const inner = document.getElementById('card-reveal');
            if (inner) inner.classList.add('flipped');
            const meaning = document.getElementById('card-meaning');
            if (meaning) meaning.style.opacity = 1;
          }, 150);
        };

        window.checkQuiz = (selected, correct) => {
          if (selected === correct) {
            nextStep();
          } else {
            alert('Listen closer to your intuition.');
          }
        };

        function nextStep() {
          if (state.currentStep < state.currentLesson.screens.length - 1) {
            state.currentStep++;
            renderStep();
          } else {
            finishLesson();
          }
        }

        function finishLesson() {
          if (!state.progress.completed.includes(state.currentLesson.id)) {
            state.progress.completed.push(state.currentLesson.id);
          }
          saveState();
          document.getElementById('player').classList.remove('active');
          renderLessons();
          updateProgressUI();
        }

        function saveState() {
          localStorage.setItem('arcana_progress', JSON.stringify(state.progress));
        }

        function updateProgressUI() {
          const pct = Math.round((state.progress.completed.length / CURRICULUM.length) * 100);
          document.getElementById('completion-percent').innerText = pct + '%';
        }

        document.getElementById('btn-next').onclick = nextStep;
        document.querySelector('.player-close').onclick = () => {
          if(confirm('Abandon this path?')) document.getElementById('player').classList.remove('active');
        };

        init();
    </script>
</body>
</html>
